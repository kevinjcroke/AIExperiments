name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let an in-progress deploy finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: stl-food-wheel/package-lock.json

      - name: Install, check and build St. Louis World Food Wheel
        working-directory: stl-food-wheel
        run: |
          npm ci
          npm run typecheck
          npm test
          # Relative base so the app works under /<repo>/stl-food-wheel/
          npx vite build --base=./

      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r site/. _site/
          cp -r stl-food-wheel/dist _site/stl-food-wheel

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

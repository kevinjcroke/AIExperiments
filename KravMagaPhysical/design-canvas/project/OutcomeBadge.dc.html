<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Outcome badge</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="/_blob/a8bd2502b3f6f5657f47b6f7c62cb886">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;0,800;1,700;1,800&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div class="rsr-root" style="box-sizing: border-box; width: 100%; display: flex; flex-direction: column; align-items: {{ align }}; gap: 10px; padding: {{ pad }}; background: {{ bg }}; min-height: {{ minH }}; justify-content: center; font-family: Inter, system-ui, sans-serif; color: #F4F1EC">
  <div style="display: inline-flex; align-items: center; gap: 8px; height: {{ h }}; padding: 0 20px 0 16px; background: {{ c.bg }}; color: {{ c.fg }}; clip-path: polygon(10px 0, 100% 0, calc(100% - 10px) 100%, 0 100%); font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-weight: 800; font-size: {{ fs }}; letter-spacing: 0.06em; text-transform: uppercase; line-height: 1; white-space: nowrap">
    <sc-if value="{{ isPass }}" hint-placeholder-val="{{ true }}">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg>
    </sc-if>
    <sc-if value="{{ isCond }}" hint-placeholder-val="{{ false }}">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h16.9a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"></path><path d="M12 9v4"></path><path d="M12 17h.01"></path></svg>
    </sc-if>
    <sc-if value="{{ isRetest }}" hint-placeholder-val="{{ false }}">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"></path><path d="M3 3v5h5"></path></svg>
    </sc-if>
    <span>{{ c.label }}</span>
  </div>
  <sc-if value="{{ showDetail }}" hint-placeholder-val="{{ true }}">
    <p style="margin: 0; max-width: 300px; font-size: 13px; line-height: 1.45; color: #B4B9C2; text-align: {{ textAlign }}; text-wrap: pretty">{{ c.detail }}</p>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"outcome":{"editor":"enum","options":["pass","conditional","retest"],"default":"pass"},"size":{"editor":"enum","options":["m","l"],"default":"l"},"detail":{"editor":"boolean","default":true},"req":{"editor":"int","min":65,"max":80,"default":75},"bare":{"editor":null},"align":{"editor":null},"$preview":{"width":390,"height":220}}'>
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const outcome = p.outcome ?? 'pass';
    const req = p.req ?? 75;
    const bare = !!p.bare;
    const showDetail = p.detail ?? !bare;
    const MAP = {
      pass: { label: 'Pass', bg: '#36D17E', fg: '#04170B', detail: 'Your average meets the ' + req + '% requirement.' },
      conditional: { label: 'Conditional pass', bg: '#F7B940', fg: '#1C1300', detail: 'You still earn the red stripe, and retest at your first stripe test at the next rank.' },
      retest: { label: 'Retest in one month', bg: '#FF6B6B', fg: '#220405', detail: 'More than 5 points below ' + req + '%. Try again in one month.' }
    };
    const c = MAP[outcome] || MAP.pass;
    const large = (p.size ?? 'l') === 'l';
    const centered = (p.align ?? 'center') === 'center';
    return {
      c,
      isPass: outcome === 'pass',
      isCond: outcome === 'conditional',
      isRetest: outcome === 'retest',
      showDetail,
      h: large ? '46px' : '36px',
      fs: large ? '22px' : '17px',
      align: centered ? 'center' : 'flex-start',
      textAlign: centered ? 'center' : 'left',
      pad: bare ? '0' : '32px 24px',
      bg: bare ? 'transparent' : '#0A0B0D',
      minH: bare ? '0' : '220px'
    };
  }
}
</script>
</body>
</html>

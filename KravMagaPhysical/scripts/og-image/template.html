<!doctype html>
<!--
  Link-preview card (Slack, iMessage, X, LinkedIn...). Render with `npm run og-image` (writes public/og-image.png).
  1200x630. Everything that matters sits in the centre 630x630, because some previews crop to a square;
  the event tiles on either side only show in the full-width card.
  Sample numbers are real: age 35, men's chart, Blue/Brown (75%), mile locked at 8:00.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      @font-face { font-family: "Barlow Condensed"; font-weight: 700; font-style: normal; src: url("../../node_modules/@fontsource/barlow-condensed/files/barlow-condensed-latin-700-normal.woff2"); }
      @font-face { font-family: "Barlow Condensed"; font-weight: 800; font-style: normal; src: url("../../node_modules/@fontsource/barlow-condensed/files/barlow-condensed-latin-800-normal.woff2"); }
      @font-face { font-family: "Barlow Condensed"; font-weight: 800; font-style: italic; src: url("../../node_modules/@fontsource/barlow-condensed/files/barlow-condensed-latin-800-italic.woff2"); }
      @font-face { font-family: "Inter"; font-weight: 100 900; src: url("../../node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2"); }

      :root {
        --bg: #0a0b0d; --ink: #f4f1ec; --ink-2: #b4b9c2; --ink-3: #8a909b;
        --stripe: #db222b; --stripe-text: #ff5c63; --auto: #43d9f5; --auto-text: #7fe6fa;
        --locked: #e9e5de; --blue: #2f6bd8; --brown: #7b4f2c;
        --display: "Barlow Condensed", sans-serif;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; }
      body {
        width: 1200px; height: 630px; overflow: hidden; position: relative;
        color: var(--ink); font-family: Inter, sans-serif; -webkit-font-smoothing: antialiased;
        background-color: var(--bg);
        background-image:
          radial-gradient(70% 70% at 50% 0%, rgb(219 34 43 / 0.26), rgb(10 11 13 / 0) 70%),
          linear-gradient(rgb(255 255 255 / 0.03) 1px, transparent 1px),
          linear-gradient(90deg, rgb(255 255 255 / 0.03) 1px, transparent 1px);
        background-size: 100% 100%, 32px 32px, 32px 32px;
      }

      /* Belt band across the top, as in the app header (Blue/Brown with the red stripe tape). */
      .band { position: absolute; top: 0; left: 0; right: 0; height: 22px; background: linear-gradient(180deg, var(--blue) 0 50%, var(--brown) 50% 100%); }
      .band::before { content: ""; position: absolute; inset: 0; background-image: repeating-linear-gradient(90deg, rgb(0 0 0 / 0.22) 0 1px, transparent 1px 5px), linear-gradient(180deg, rgb(255 255 255 / 0.14), rgb(0 0 0 / 0.28)); }
      .band::after { content: ""; position: absolute; top: 0; bottom: 0; right: 14%; width: 64px; background: var(--stripe); box-shadow: -4px 0 0 var(--bg), 4px 0 0 var(--bg); }

      /* Centre column: the square-safe part. */
      .center { position: absolute; top: 22px; bottom: 0; left: 285px; width: 630px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px; text-align: center; }
      .wordmark { display: flex; align-items: center; gap: 14px; font: italic 800 58px/1 var(--display); text-transform: uppercase; letter-spacing: 0.02em; }
      .wordmark .ready { background: var(--stripe); color: #fff; padding: 7px 22px 7px 18px; clip-path: polygon(14px 0, 100% 0, calc(100% - 14px) 100%, 0 100%); }
      h1 { margin: 0; font: 800 112px/0.88 var(--display); text-transform: uppercase; letter-spacing: -0.005em; }
      h1 em { font-style: normal; color: var(--stripe-text); }
      .events { font: 700 26px/1 var(--display); letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-2); }
      .events b { color: var(--stripe-text); padding: 0 6px; }

      /* Side tiles: mini event cards. */
      .col { position: absolute; top: 22px; bottom: 0; display: flex; flex-direction: column; justify-content: center; gap: 22px; width: 240px; }
      .col.left { left: 28px; }
      .col.right { right: 28px; }
      .tile { position: relative; border-radius: 14px; padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 10px; }
      .tile.auto { background: #0c1518; border: 2px dashed rgb(67 217 245 / 0.8); }
      .tile.locked { background: #17191d; border: 2px solid #5d6470; }
      .top { display: flex; justify-content: space-between; align-items: center; }
      .name { font: 800 23px/1 var(--display); letter-spacing: 0.05em; text-transform: uppercase; }
      .name span { color: var(--stripe-text); font-style: italic; margin-right: 6px; }
      .tag { font: 800 14px/1 var(--display); letter-spacing: 0.14em; text-transform: uppercase; padding: 6px 10px; border-radius: 999px; }
      .auto .tag { color: var(--auto-text); border: 1.5px solid var(--auto); background: rgb(67 217 245 / 0.12); }
      .locked .tag { color: var(--bg); background: var(--locked); }
      .nums { display: flex; justify-content: space-between; align-items: baseline; }
      .value { font: 800 54px/0.95 var(--display); }
      .value small { font: 700 18px/1 var(--display); letter-spacing: 0.06em; color: var(--ink-3); margin-left: 4px; }
      .pts { font: 800 30px/1 var(--display); }
      .pts small { font: 700 14px/1 var(--display); letter-spacing: 0.12em; color: var(--ink-3); margin-left: 3px; }
      .auto .value, .auto .pts { color: var(--auto-text); }
      .rail { position: relative; height: 22px; }
      .rail .track { position: absolute; top: 7px; left: 0; right: 0; height: 8px; border-radius: 99px; background: #262a31; }
      .rail .fill { position: absolute; top: 7px; height: 8px; border-radius: 99px; }
      .auto .fill { background: repeating-linear-gradient(135deg, #43d9f5 0 6px, #2bb3cc 6px 12px); }
      .locked .fill { background: var(--locked); }
      .rail .thumb { position: absolute; top: 0; width: 22px; height: 22px; margin-left: -11px; border-radius: 50%; background: #f4f1ec; }
      .auto .thumb { border: 4px solid #43d9f5; box-shadow: 0 0 0 5px rgb(67 217 245 / 0.18); }
      .locked .thumb { border: 4px solid #0a0b0d; box-shadow: 0 0 0 5px rgb(233 229 222 / 0.25); }
    </style>
  </head>
  <body>
    <div class="band"></div>

    <div class="col left">
      <!-- Mile: lower is better, so the fill runs from the right edge to the thumb (as in the app). -->
      <div class="tile locked">
        <div class="top"><span class="name"><span>01</span>Mile</span><span class="tag">Locked</span></div>
        <div class="nums"><span class="value">8:00</span><span class="pts">82<small>PTS</small></span></div>
        <div class="rail"><div class="track"></div><div class="fill" style="left: 30%; right: 0"></div><div class="thumb" style="left: 30%"></div></div>
      </div>
      <div class="tile auto">
        <div class="top"><span class="name"><span>02</span>Push-ups</span><span class="tag">Auto</span></div>
        <div class="nums"><span class="value">48<small>REPS</small></span><span class="pts">73<small>PTS</small></span></div>
        <div class="rail"><div class="track"></div><div class="fill" style="left: 0; width: 64%"></div><div class="thumb" style="left: 64%"></div></div>
      </div>
    </div>

    <div class="center">
      <div class="wordmark"><span>Red Stripe</span><span class="ready">Ready</span></div>
      <h1>Know what<br />you need<br /><em>to pass.</em></h1>
      <div class="events">Mile<b>·</b>Push-ups<b>·</b>Squats<b>·</b>Plank</div>
    </div>

    <div class="col right">
      <div class="tile auto">
        <div class="top"><span class="name"><span>03</span>Squats</span><span class="tag">Auto</span></div>
        <div class="nums"><span class="value">71<small>REPS</small></span><span class="pts">73<small>PTS</small></span></div>
        <div class="rail"><div class="track"></div><div class="fill" style="left: 0; width: 60%"></div><div class="thumb" style="left: 60%"></div></div>
      </div>
      <div class="tile auto">
        <div class="top"><span class="name"><span>04</span>Plank</span><span class="tag">Auto</span></div>
        <div class="nums"><span class="value">2:00</span><span class="pts">72<small>PTS</small></span></div>
        <div class="rail"><div class="track"></div><div class="fill" style="left: 0; width: 52%"></div><div class="thumb" style="left: 52%"></div></div>
      </div>
    </div>
  </body>
</html>
